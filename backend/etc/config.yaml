Name: p2p-api
Host: 0.0.0.0
Port: 8888
Mode: dev

# 敏感欄位透過環境變數注入：APP_JWT_ACCESS_SECRET
App:
  AccessSecret: ""
  AccessExpire: 86400

# 敏感欄位透過環境變數注入：BACKEND_JWT_ACCESS_SECRET
Backend:
  AccessSecret: ""
  AccessExpire: 86400

# 敏感欄位透過環境變數注入：DATABASE_DSN
Database:
  DSN: ""

# 敏感欄位透過環境變數注入：REDIS_ADDR / REDIS_PASSWORD
Redis:
  Addr: ""
  Password: ""
  PoolSize: 10

Nats:
  URL: "tls://connect.ngs.global"
  CredsPath: "./NGS-Default-CLI.creds"     # Synadia Cloud: 由 NATS_CREDS_PATH 環境變數注入
  User: ""          # 本地 NATS: 填入帳號（CredsPath 有值時忽略）
  Password: ""      # 本地 NATS: 填入密碼（CredsPath 有值時忽略）
  StreamName: "p2p-exchange"
  ConsumerName: "p2p-exchange-consumer"

# Tron 熱錢包設定（v0.3.0）
# 敏感欄位透過環境變數注入：TRON_GRID_API_KEY / TRON_HOT_WALLET_ADDRESS / TRON_HOT_WALLET_PRIVATE_KEY
Tron:
  Network: "nile"
  TronGridURL: "https://nile.trongrid.io"
  USDTContractAddress: "TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj"
  ConfirmationBlocks: 6
  ScanIntervalSeconds: 30
  WithdrawIntervalSeconds: 10

# ECPay 金流設定（v0.3.0）
# 敏感欄位透過環境變數注入：ECPAY_HASH_KEY / ECPAY_HASH_IV
# 測試環境 MerchantID: 2000132（綠界測試用）
ECPay:
  MerchantID: "2000132"
  BaseURL: "https://payment-stage.ecpay.com.tw"

