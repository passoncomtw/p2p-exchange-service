Name: p2p-api
Mode: dev
Host: 0.0.0.0
Port: 8888

# 敏感欄位透過環境變數注入：APP_JWT_ACCESS_SECRET
App:
  AccessSecret: ""
  AccessExpire: 86400

# 敏感欄位透過環境變數注入：BACKEND_JWT_ACCESS_SECRET
Backend:
  AccessSecret: ""
  AccessExpire: 86400

# 敏感欄位透過環境變數注入：DATABASE_DSN（與 legacy 共用同一個 DB）
Database:
  DSN: ""

# 敏感欄位透過環境變數注入：REDIS_ADDR / REDIS_PASSWORD（與 legacy 共用同一個 Redis）
Redis:
  Addr: ""
  Password: ""
  PoolSize: 10

WebSocket:
  Enabled: true
  Host: 0.0.0.0
  Port: 8889

# URL 空字串時 NATS 功能關閉、服務仍可啟動（適合本機開發不需要 NATS 的情境）。
# 機敏欄位透過環境變數注入：NATS_URL / NATS_CREDS_PATH（Synadia Cloud 等 TLS + creds 檔）
# 或 NATS_URL / NATS_USER / NATS_PASSWORD（本地 NATS，帳密登入）。
# CredsPath 指向的檔案需由部署環境掛載（K8s Secret volume），不可打包進 image。
Nats:
  URL: ""
  CredsPath: ""
  User: ""
  Password: ""
  StreamName: "p2p-exchange"
  ConsumerName: "p2p-exchange-consumer"

# ECPay 金流設定（與 legacy etc/config.yaml 同一組非機敏預設值）
# 機敏欄位透過環境變數注入：ECPAY_HASH_KEY / ECPAY_HASH_IV / ECPAY_RETURN_URL / ECPAY_CLIENT_BACK_URL
# HashKey / HashIV 未注入時 ECPay.IsEnabled() 為 false，TWD 入金 API 回 503，服務仍可啟動
ECPay:
  MerchantID: "2000132"
  BaseURL: "https://payment-stage.ecpay.com.tw"
